name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# 允許同一時間只有一個部署工作流在執行，避免衝突
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # 加上快取，可以加快以後安裝套件的速度

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5 # 升級至 v5

      - name: Upload build artifact for Pages
        uses: actions/upload-pages-artifact@v3 # 升級至 v3 (解決錯誤的核心)
        with:
          path: ./dist

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write # 轉移到 deploy job 需要的權限
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # 升級至 v4